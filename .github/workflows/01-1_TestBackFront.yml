name: 01-1 - Integration - Test_Back_Front

on:
  workflow_call

jobs:
  backend:
    runs-on: ubuntu-latest
    default:
      run:
        working-directory: ./backend

    services:
      mariadb:
        image: mariadb-latest
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: --hearthcheck-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5 --healthcheck-retries=3

    env:
      BDD_HOST: 127.0.0.1
      BDD_PASS: test
      BDD_NAME: test
      BDD_USER: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Database Cnx Checkout
        run: |
          sudo apt-get install -y mariadb-client
          mysql --host 127.0.0.1 --port 3306 -u root -ptoor -e "SHOW_DATABASES;"

      - name: Setup Node.jobs
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      
      - name: Install Backend Dependencies
        run: npm install

      - name: Init bdd
        run: npm run initbdd

      - name: Populate bdd
        run: |
          mysql -u root -ptoor --host 127.0.0.1 --port 3306 --database test < ./test/insert_test_user .sql
      
      - name: Run backend Tests
        run: npm run test:cov

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage
          retention-days: 3

  frontend:
    needs: [backend]
    runs-on: ubuntu-latest
    default:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code 
        uses: actions/checkout@v3

      - name: Start HotBuild Backend
        run: |
          cd ../_tools/docker
          docker compose -f docker-compose-back-build.yml up -d
          docker ps -a
      
      - name: Sleep for 10 seconds 
        uses: jakajaris/wait-action@master
        with:
          time: '10s'
      
      - name: Test Backend Container 
        if: success()
        run: |
          curl -v http://127.0.0.1:12000
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Cypress E2E Install
        uses: cypress-io/github-action@v6
        with: 
          runTests: false
          working-directory: ./frontend 

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Cypress E2E Tests 
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ./frontend
          start: npm run dev
      
      - name: Cypress Test and Coverage
        run: npm run cypress:cov

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ./frontend/cypress/screenshots
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: ./frontend/cypress/videos
          retention-days: 3
      
      - name: upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: fronted-coverage-report
          path: frontend/coverage
          retention-days: 1

      - name: Shutdown Hotbuild backend
        if: always()
        run: |
          cd ../_tools/docker
          docker compose -f docker-compose-back-build.yml down