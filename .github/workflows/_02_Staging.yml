name: 02 - Staging

on:
  push:
    branches:
      - develop
      - release/*

jobs:
  Display_Data:
    runs-on: ubuntu-latest
    steps:
      - run: env | sort

  Build_Push_Docker:
    if: ${{ github.ref_name == 'develop' }}
    uses: ./.github/workflows/02-1_Docker_Ghcr.yml
    secrets: inherit
    with:
      docker_mode: canary


  Trivy_Scan:
    needs: [Build_Push_Docker]
    uses: ./.github/workflows/02-2_TrivyScan.yml
    secrets: inherit